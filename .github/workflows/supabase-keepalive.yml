name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일간 API 요청이 없으면 프로젝트가 자동 일시정지됩니다.
# 이 워크플로우가 3일마다 가벼운 조회 요청을 보내서 프로젝트가 계속 살아있게 합니다.

on:
  schedule:
    - cron: '0 3 */3 * *'   # 3일마다 (UTC 03:00, 한국시간 낮 12시경)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://lkimtjqooxzvlbnigqyk.supabase.co/rest/v1/stage0_progress?select=participant_code&limit=1" \
            -H "apikey: sb_publishable_d2iXq0ymtRBfmEdqgw_lWQ_mRSPiLfP" \
            -H "Authorization: Bearer sb_publishable_d2iXq0ymtRBfmEdqgw_lWQ_mRSPiLfP"
