<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>타이핑 기반 사전학습 프로그램</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F6F1E7;
    --card:#FFFDF8;
    --ink:#1E2A38;
    --ink-soft:#57657A;
    --teal:#2C6E63;
    --teal-light:#E4F0EC;
    --border:rgba(30,42,56,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    display:flex;
    justify-content:center;
    padding:48px 16px 64px;
  }
  .app{width:100%;max-width:700px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:42px;
    color:var(--teal);
    margin:0 0 12px;
    text-wrap:balance;
  }
  .lede{
    font-size:17px;
    color:var(--ink-soft);
    line-height:1.65;
    margin:0 0 36px;
    text-wrap:balance;
  }
  .card{
    display:block;
    background:var(--card);
    border:2px solid var(--border);
    border-radius:18px;
    padding:30px 32px;
    margin-bottom:18px;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    border-color:var(--teal);
    transform:translateY(-2px);
    box-shadow:0 8px 22px rgba(44,110,99,.16);
  }
  .badge{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .connector{
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    opacity:.5;
    margin:-4px 0 14px;
  }
  .connector svg{width:16px; height:16px;}
  .card h2{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:25px;
    margin:0 0 8px;
  }
  .card p{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.65;
    margin:0;
  }
  .arrow{float:right; color:var(--teal); font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:700;}

  .card.disabled{
    cursor:default;
    opacity:.55;
  }
  .card.disabled:hover{
    border-color:var(--border);
    transform:none;
    box-shadow:none;
  }
  .badge.badge-soon{background:var(--border); color:var(--ink-soft);}
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:32px 0 12px;
  }
  .section-label:first-of-type{margin-top:0;}
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow">연구용 웹 프로그램</div>
  <h1>타이핑 기반 사전학습 프로그램</h1>
  <p class="lede">외국인 유학생 대상 한국어 글쓰기 수업을 위한 사전학습 도구입니다.<br/>아래에서 해당 주차 단계를 선택하세요.</p>

  <div class="section-label">사전학습 (타자 기초)</div>

  <a class="card" href="stage0_jari_practice.html">
    <span class="arrow">→</span>
    <span class="badge">1주차</span>
    <h2>자판 자리 연습</h2>
    <p>한글 키보드 자판 위치·손가락 사용법 연습 (10단계 + 게임 모드)</p>
  </a>

  <div class="connector" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14M6 13l6 6 6-6"/></svg>
  </div>

  <div class="section-label">사전학습 (강의 지문 연계)</div>

  <a class="card" href="week2_3_reflective_writing.html">
    <span class="arrow">→</span>
    <span class="badge">2~3주차</span>
    <h2>성찰적 글쓰기</h2>
    <p>교재 p23~44</p>
  </a>

  <div class="connector" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14M6 13l6 6 6-6"/></svg>
  </div>

  <a class="card" href="week4_5_summary.html">
    <span class="arrow">→</span>
    <span class="badge">4~5주차</span>
    <h2>요약을 활용한 글쓰기</h2>
    <p>교재 p45~64</p>
  </a>
</div>
</body>
</html>
